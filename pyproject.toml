[project]
name = "alaska-senate-brief-experiment"
version = "0.1.0"
description = "A randomized test of what two blocks of a forecasting brief change in AI agents' conditional forecasts of Alaska's 2026 US Senate race"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=2.0", "pyyaml>=6.0", "scipy>=1.13", "tree-sitter>=0.25", "tree-sitter-bash>=0.25"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.5", "hypothesis>=6.100"]

[project.scripts]
i86 = "i86.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/i86"]

[tool.pytest.ini_options]
testpaths = ["tests"]
